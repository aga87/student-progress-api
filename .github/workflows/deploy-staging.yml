name: Deploy Staging to Cloud Run
run-name: '[STAGING] Running staging release workflow #${{ github.run_number }}'

on:
  push:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: student-progress-staging
  REGION: europe-west3
  REPOSITORY: student-progress-api
  SERVICE: student-progress-api
  CLOUD_RUN_SERVICE_ACCOUNT: student-progress-app-sa@student-progress-staging.iam.gserviceaccount.com
  IMAGE_URI: europe-west3-docker.pkg.dev/student-progress-staging/student-progress-api/student-progress-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_URI }}:${{ github.sha }}
            ${{ env.IMAGE_URI }}:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_URI }}:${{ github.sha }}
          env_vars: |
            NODE_ENV=production
            DB_CONNECTION_TYPE=cloud-sql-iam
            DB_INSTANCE_CONNECTION_NAME=student-progress-staging:europe-west3:student-progress-mysql-staging
            DB_USER=student-progress-app-sa
            DB_NAME=student_progress
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            REDIS_PORT=6379
            REDIS_TTL_SECONDS=60
          flags: |
            --service-account=${{ env.CLOUD_RUN_SERVICE_ACCOUNT }}
            --network=default
            --subnet=default
            --vpc-egress=private-ranges-only
            --allow-unauthenticated
